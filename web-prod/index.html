<!DOCTYPE html>

  <head>
    <meta charset="UTF-8">

    <link rel="icon" href="favicon.ico">

  <body>

    <div id="custom-alert" class="modal-overlay">
      <div class="modal-content">
        <div id="alert-icon" class="modal-icon"></div>
        <h3 id="alert-title" class="modal-title">Info</h3>
        <p id="alert-text" class="modal-text">Pesan</p>
        <button onclick="tutupAlert()" class="btn-primary" id="alert-btn">Mengerti</button>

    </div>

    <div class="container">

      <div class="header-container">

        <div class="subtitle">Sistem Pelaporan Sales Telur Asin</div>
      </div>

      <div class="scroll-area">
        <div id="home-section">
          <button class="btn-install hidden" id="btn-install" onclick="installAplikasi()">

            Install Aplikasi
          </button>
          <button class="btn-primary" onclick="location.href='laporan-satuan.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12l2 2 4-4"/></svg>
            Laporan Satuan
          </button>
          <button class="btn-primary" onclick="location.href='titik-baru.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><path d="M12 7v4M10 9h4"/></svg>
            Buka Titik Baru
          </button>
          <button class="btn-primary" onclick="location.href='manajemen-rute.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a4 4 0 0 0 4-4 4 4 0 0 0-4-4H9a4 4 0 0 1-4-4 4 4 0 0 1 4-4h1"/></svg>
            Manajemen Rute
          </button>
          <button class="btn-primary" onclick="location.href='pembeli-end-user.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            Pembeli End User
          </button>
          <button class="btn-primary" onclick="location.href='peta-persebaran.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
            Peta Persebaran Toko
          </button>
          <button class="btn-primary" onclick="location.href='lokasi-toko.html'">

            Perbarui Lokasi Toko

          <button class="btn-primary" onclick="location.href='hutang.html'">

            Catatan Hutang
          </button>
          <button class="btn-primary" onclick="location.href='riwayat.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
            Riwayat Rekap
          </button>
        </div>
      </div>

    </div>

    <script src="shared/app.js"></script>
    <script>
      let dropdownData = {};

      // Tombol Install hanya saat dibuka lewat browser (bukan dari ikon aplikasi yang sudah ter-install).
      // Chrome/Android: pakai prompt install bawaan (beforeinstallprompt). iPhone/browser lain tidak punya
      // prompt itu, jadi tombolnya menampilkan petunjuk manual.
      let promptInstall = null;
      const sudahJadiAplikasi = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      const tombolInstall = document.getElementById('btn-install');
      if (!sudahJadiAplikasi()) tombolInstall.classList.remove('hidden');

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        promptInstall = e;
      });
      window.addEventListener('appinstalled', () => {
        promptInstall = null;
        tombolInstall.classList.add('hidden');
        tampilAlert('success', 'Terpasang', 'Super Muncul sudah ada di layar utama HP.');
      });

      async function installAplikasi() {
        if (promptInstall) {
          promptInstall.prompt();
          const { outcome } = await promptInstall.userChoice;
          if (outcome === 'accepted') tombolInstall.classList.add('hidden');
          promptInstall = null;
          return;
        }
        const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        tampilAlert('warning', 'Cara Install',
          iOS ? 'Buka halaman ini di Safari, ketuk tombol Bagikan (kotak dengan panah ke atas), lalu pilih "Tambah ke Layar Utama".'
              : 'Ketuk menu browser (titik tiga ⋮ di pojok kanan atas), lalu pilih "Instal aplikasi" atau "Tambahkan ke layar utama".');
      }
    </script>
  </body>
</html>
