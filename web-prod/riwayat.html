<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Super Muncul - Riwayat</title>
    <link rel="icon" href="favicon.ico">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="theme-color" content="#4F46E5">
    <link rel="stylesheet" href="shared/style.css">
    <style>
      .filter-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
      .filter-chips button { flex-shrink: 0; width: auto; margin: 0; padding: 7px 12px; font-size: 12.5px; border-radius: 20px; background: #F3F4F6; color: var(--text-muted); border: 1.5px solid #E5E7EB; }
      .filter-chips button.aktif { background: var(--primary); color: #fff; border-color: var(--primary); }
      .riwayat-tanggal { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; margin: 16px 2px 8px; }
      .riwayat-card { border: 1px solid #E5E7EB; border-left: 4px solid var(--primary); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: #FFF; }
      .riwayat-card-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
      .riwayat-judul { font-weight: 700; font-size: 14.5px; }
      .riwayat-jam { flex-shrink: 0; font-size: 11.5px; color: var(--text-muted); }
      .riwayat-tipe { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
      .riwayat-detail { font-size: 13px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
      .riwayat-kosong { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 13.5px; }
    </style>
  </head>
  <body>

    <div id="custom-alert" class="modal-overlay">
      <div class="modal-content">
        <div id="alert-icon" class="modal-icon"></div>
        <h3 id="alert-title" class="modal-title">Info</h3>
        <p id="alert-text" class="modal-text">Pesan</p>
        <button onclick="tutupAlert()" class="btn-primary" id="alert-btn">Mengerti</button>
      </div>
    </div>

    <div class="container">
      <div class="feature-header">
        <button class="btn-back-icon" onclick="location.href='index.html'" aria-label="Kembali">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h2>Riwayat</h2>
      </div>

      <div class="scroll-area">
        <p style="font-size: 11.5px; color: var(--text-muted); margin: 0 0 12px; line-height: 1.4;">Riwayat kiriman dari HP ini saja (tersimpan lokal, maksimal 300 data terakhir).</p>
        <div class="filter-chips" id="filter-chips"></div>
        <div id="riwayat-list"></div>
      </div>
    </div>

    <script src="shared/app.js"></script>
    <script>
      let dropdownData = {};
      const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', "Jum'at", 'Sabtu'];
      const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const rp = n => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
      const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      // tipe -> [label filter, warna, fungsi (data) => [judul, detail[]]]
      const TIPE = {
        submitLaporanSatuan: ['Laporan', '#4F46E5', d => [d.namaToko || 'Laporan Toko', [
          `Status: ${d.status}${d.status === 'Restock' ? ` (${d.jumlahRestock} btr)` : ''}`,
          `Sisa telur: ${d.sisaTelur} btr · Setoran: ${rp(d.totalSetoran)}`,
          d.keteranganTouched && d.keterangan ? `Ket: ${d.keterangan}` : ''
        ]]],
        ruteSelesai: ['Rute', '#10B981', d => ['Rekap Rute Selesai', [
          `Toko: ${d.totalTokoDikunjungi} · Tutup: ${(d.tokoTutup || []).length} · Titik baru: ${d.totalTitikBaru || 0}`,
          `Telur awal: ${d.telurAwal} · Keluar: ${d.telurKeluar} · Sisa: ${d.sisaTelurBaru} · Retur: ${d.totalSisaTelur} btr`,
          `Total setoran: ${rp(d.totalSetoran)}`
        ]]],
        submitTitikBaru: ['Titik Baru', '#8B5CF6', d => [d.namaWarung, [`Pemilik: ${d.pemilik} · ${d.hp}`, `Drop awal: ${d.jumlahAwal} btr`]]],
        submitPembeliEndUser: ['End User', '#F59E0B', d => [d.namaCustomer, [`${d.jumlahBeli} btr · Sales: ${d.namaSales}`, d.hp]]],
        submitHutang: ['Hutang', '#EF4444', d => [d.nama, [`${d.tipe === 'Bayar' ? 'Bayar' : 'Hutang'}: ${rp(d.jumlah)}`, d.keterangan ? `Ket: ${d.keterangan}` : '']]]
      };

      let filterAktif = 'semua';

      function renderChips() {
        const opsi = [['semua', 'Semua'], ...Object.entries(TIPE).map(([k, v]) => [k, v[0]])];
        document.getElementById('filter-chips').innerHTML = opsi.map(([k, label]) =>
          `<button type="button" class="${k === filterAktif ? 'aktif' : ''}" onclick="filterAktif='${k}'; render()">${label}</button>`).join('');
      }

      function render() {
        renderChips();
        const list = ambilRiwayat().filter(r => TIPE[r.tipe] && (filterAktif === 'semua' || r.tipe === filterAktif));
        const box = document.getElementById('riwayat-list');
        if (list.length === 0) { box.innerHTML = '<div class="riwayat-kosong">Belum ada riwayat.</div>'; return; }

        let html = '', tanggalTerakhir = '';
        list.forEach(r => {
          const w = new Date(r.waktu);
          const tanggal = `${HARI[w.getDay()]}, ${w.getDate()} ${BULAN[w.getMonth()]} ${w.getFullYear()}`;
          if (tanggal !== tanggalTerakhir) { html += `<div class="riwayat-tanggal">${tanggal}</div>`; tanggalTerakhir = tanggal; }
          const [label, warna, fmt] = TIPE[r.tipe];
          const [judul, detail] = fmt(r.data || {});
          html += `<div class="riwayat-card" style="border-left-color:${warna}">
            <div class="riwayat-tipe" style="color:${warna}">${label}</div>
            <div class="riwayat-card-head"><span class="riwayat-judul">${esc(judul)}</span><span class="riwayat-jam">${String(w.getHours()).padStart(2, '0')}:${String(w.getMinutes()).padStart(2, '0')}</span></div>
            <div class="riwayat-detail">${detail.filter(Boolean).map(esc).join('<br>')}</div>
          </div>`;
        });
        box.innerHTML = html;
      }

      document.addEventListener('DOMContentLoaded', render);
    </script>
  </body>
</html>
