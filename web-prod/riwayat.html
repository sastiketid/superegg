<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Super Muncul - Riwayat Rekap</title>
    <link rel="icon" href="favicon.ico">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="theme-color" content="#4F46E5">
    <link rel="stylesheet" href="shared/style.css">
    <style>
      .rute-card { border: 1px solid #E5E7EB; border-left: 4px solid var(--success); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: #FFF; cursor: pointer; }
      .rute-card:active { background: #F9FAFB; }
      .rute-card b { display: block; font-size: 15px; }
      .rute-card small { display: block; margin-top: 3px; font-size: 12.5px; color: var(--text-muted); }
      .rute-card .total { font-weight: 800; color: var(--text-main); }
      .riwayat-kosong { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 13.5px; }
      .detail-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
      .detail-tabs button { margin: 0; padding: 10px 6px; font-size: 13.5px; border-radius: 10px; background: #F3F4F6; color: var(--text-muted); border: 1.5px solid #E5E7EB; }
      .detail-tabs button.is-on { background: var(--text-main); border-color: var(--text-main); color: #FFF; }
      .detail-judul { margin: 0 0 2px; text-align: center; color: var(--primary); }
      .detail-tanggal { margin: 0 0 6px; text-align: center; font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
    </style>
  </head>
  <body>

    <div id="custom-alert" class="modal-overlay">
      <div class="modal-content">
        <div id="alert-icon" class="modal-icon"></div>
        <h3 id="alert-title" class="modal-title">Info</h3>
        <p id="alert-text" class="modal-text">Pesan</p>
        <button onclick="tutupAlert()" class="btn-primary" id="alert-btn">Mengerti</button>
      </div>
    </div>

    <div class="container">
      <div class="feature-header">
        <button class="btn-back-icon" id="btn-header-back" onclick="location.href='index.html'" aria-label="Kembali">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h2>Riwayat Rekap</h2>
      </div>

      <div class="scroll-area" id="scroll-area">
        <div id="daftar-section">
          <p style="font-size: 11.5px; color: var(--text-muted); margin: 0 0 12px; line-height: 1.4;">Rekap rute yang sudah diakhiri di HP ini (tersimpan lokal, 90 rute terakhir).</p>
          <div id="daftar-rute"></div>
        </div>

        <div id="detail-section" class="hidden">
          <div class="detail-tabs">
            <button type="button" class="is-on" id="tab-rekap" onclick="tampilTab('rekap')">Rekap</button>
            <button type="button" id="tab-toko" onclick="tampilTab('toko')">List Toko</button>
          </div>
          <div id="detail-rekap">
            <h3 class="detail-judul">Rekap Rute</h3>
            <p class="detail-tanggal" id="detail-tanggal"></p>
            <div id="detail-rekap-isi"></div>
            <button class="btn-primary" id="btn-kirim-ulang" onclick="kirimUlang()">Kirim Ulang ke WhatsApp</button>
          </div>
          <div id="detail-toko" class="hidden"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="shared/app.js"></script>
    <script>
      let dropdownData = {};
      let ruteTerbuka = null;

      const daftarRute = () => ambilRiwayat().filter(r => r.tipe === 'ruteSelesai');

      function renderDaftar() {
        const list = daftarRute();
        const box = document.getElementById('daftar-rute');
        if (list.length === 0) { box.innerHTML = '<div class="riwayat-kosong">Belum ada rute yang diakhiri.</div>'; return; }
        box.innerHTML = '';
        list.forEach(item => {
          const d = item.data || {};
          const card = document.createElement('div');
          card.className = 'rute-card';
          const titipan = d.perubahanTitipan !== undefined ? ` · titipan ${tandaButir(d.perubahanTitipan)} btr` : '';
          card.innerHTML = `<b>${formatTanggalRekap(d.tanggalRute || item.waktu)}</b>
            <small>${d.totalTokoDikunjungi || 0} toko${titipan}</small>
            <small>Total setoran <span class="total">${formatRupiah(d.totalSetoran || 0)}</span></small>`;
          card.onclick = () => bukaDetail(item);
          box.appendChild(card);
        });
      }

      function bukaDetail(item) {
        const d = item.data || {};
        ruteTerbuka = d.rute || null;
        document.getElementById('daftar-section').classList.add('hidden');
        document.getElementById('detail-section').classList.remove('hidden');
        document.getElementById('btn-header-back').onclick = tutupDetail;
        document.getElementById('detail-tanggal').textContent = formatTanggalRekap(d.tanggalRute || item.waktu);
        document.getElementById('tab-toko').disabled = !ruteTerbuka;
        document.getElementById('btn-kirim-ulang').classList.toggle('hidden', !ruteTerbuka);
        if (ruteTerbuka) {
          document.getElementById('detail-rekap-isi').innerHTML = htmlRekap(ruteTerbuka);
          document.getElementById('detail-toko').innerHTML = htmlListToko(ruteTerbuka);
        } else {
          // Rute yang diakhiri sebelum arsip lengkap ada: cuma ringkasan angka.
          document.getElementById('detail-rekap-isi').innerHTML = `<p class="rekap-cek">Rincian rute ini tidak tersedia (diakhiri sebelum pembaruan arsip rekap).</p>
            <div class="rekap-total"><span>TOTAL SETORAN</span><b>${formatRupiah(d.totalSetoran || 0)}</b></div>`;
        }
        tampilTab('rekap');
      }

      function tutupDetail() {
        document.getElementById('detail-section').classList.add('hidden');
        document.getElementById('daftar-section').classList.remove('hidden');
        document.getElementById('btn-header-back').onclick = () => location.href = 'index.html';
        document.getElementById('scroll-area').scrollTop = 0;
      }

      function tampilTab(tab) {
        document.getElementById('tab-rekap').classList.toggle('is-on', tab === 'rekap');
        document.getElementById('tab-toko').classList.toggle('is-on', tab === 'toko');
        document.getElementById('detail-rekap').classList.toggle('hidden', tab !== 'rekap');
        document.getElementById('detail-toko').classList.toggle('hidden', tab !== 'toko');
        document.getElementById('scroll-area').scrollTop = 0;
      }

      function kirimUlang() {
        if (!ruteTerbuka) return;
        kirimRekapWA(document.getElementById('detail-rekap'), teksRekapWA(ruteTerbuka), document.getElementById('btn-kirim-ulang'));
      }

      document.addEventListener('DOMContentLoaded', renderDaftar);
    </script>
  </body>
</html>
