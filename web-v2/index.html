<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Super Eggo V2 - Menu (Sandbox)</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="shared/style.css">
  </head>
  <body>

    <div id="custom-alert" class="modal-overlay">
      <div class="modal-content">
        <div id="alert-icon" class="modal-icon"></div>
        <h3 id="alert-title" class="modal-title">Info</h3>
        <p id="alert-text" class="modal-text">Pesan</p>
        <button onclick="tutupAlert()" class="btn-primary" id="alert-btn">Mengerti</button>
      </div>
    </div>

    <div class="container">

      <div class="header-container">
        <img src="SuperEggo.webp" alt="Logo Super Eggo" class="header-logo" onerror="this.style.display='none'">
        <h2>Super Eggo V2</h2>
        <div class="subtitle">Sistem Pelaporan Sales Canvasser</div>
        <div class="badge-sandbox">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1.5px; margin-right:3px;"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Data Dummy, Bukan Produksi
        </div>
      </div>

      <div class="scroll-area">
        <div id="home-section">
          <button class="btn-primary" onclick="location.href='laporan-satuan.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12l2 2 4-4"/></svg>
            Laporan Satuan
          </button>
          <button class="btn-primary" onclick="location.href='titik-baru.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><path d="M12 7v4M10 9h4"/></svg>
            Buka Titik Baru
          </button>
          <button class="btn-primary" onclick="location.href='manajemen-rute.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a4 4 0 0 0 4-4 4 4 0 0 0-4-4H9a4 4 0 0 1-4-4 4 4 0 0 1 4-4h1"/></svg>
            Manajemen Rute
          </button>
          <button class="btn-primary" onclick="location.href='pembeli-end-user.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            Pembeli End User
          </button>
          <button class="btn-primary" onclick="location.href='peta-persebaran.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
            Peta Persebaran Toko
          </button>
        </div>
      </div>

    </div>

    <script src="shared/app.js"></script>
    <script>
      let dropdownData = {};

      function segeraHadir() {
        tampilAlert('warning', 'Segera Hadir', 'Fitur ini belum tersedia di sandbox ini.');
      }
    </script>
  </body>
</html>
